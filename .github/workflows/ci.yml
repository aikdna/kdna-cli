name: Public contract local candidate
on: [pull_request, push]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.5.1'
          check-latest: false
      - run: node scripts/check-surface.cjs
      # Exact unpublished Core/Read RCs must be provisioned before this can pass.
      # Integrity failure must not fall back to an older registry package/source.
      - run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm pack --ignore-scripts --json > packed-files.json
      - run: node scripts/check-surface.cjs packed-files.json
